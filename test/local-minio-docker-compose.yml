---
name: local-minio
services:
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: openmsistream-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /tmp/data --console-address ":9001"
