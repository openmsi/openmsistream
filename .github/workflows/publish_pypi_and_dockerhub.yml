name: Publish PyPI release and Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build the Docker image from"
        required: true
        default: main
      image_tag:
        description: "Docker tag to push, e.g. v1.8.8"
        required: true
      push_latest:
        description: "Also push the 'latest' tag"
        type: boolean
        default: true

jobs:
  # Upload to PyPI (only for real releases; a manual run just rebuilds the image)
  pypi_upload:
    if: github.event_name == 'release'
    name: Push new release to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Ensure full Git history for poetry-dynamic-versioning

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"  # Explicit Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine

      - name: Build and publish to PyPI
        env:
          TWINE_USERNAME: __token__  # Username has to be __token__ to use API key directly
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}  # PyPI API key registered as an action secret for the repo
        run: |
          python -m build  # Use build module instead of setup.py
          twine check dist/*
          twine upload --skip-existing dist/*

      - name: Wait for updates
        run: sleep 300s
        shell: bash

  # Build the Docker image with the newly uploaded openmsistream and push to Docker Hub
  push_to_registry:
    needs: pypi_upload
    # Runs after a successful PyPI upload, or on its own for a manual re-run
    if: ${{ always() && needs.pypi_upload.result != 'failure' && needs.pypi_upload.result != 'cancelled' }}
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: openmsi/openmsistream
          tags: |
            type=ref,event=tag,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.image_tag || 'unused' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.push_latest) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/openmsistream
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
